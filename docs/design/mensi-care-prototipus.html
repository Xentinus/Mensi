document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2,.85,.3,1); }\n  .toastbar { animation: toastShrink 3.4s linear forwards; }\n  @media (min-width: 1000px) { .toastwrap { left:auto; right:28px; bottom:auto; top:24px; justify-content:flex-end; } .toastwrap > div { max-width:380px; } }\n  .shell { display: flex; flex-direction: column; min-height: 100vh; }\n  .side { display: none; }\n  .tabbar { display: flex; }\n  .cols2 { display: grid; grid-template-columns: 1fr; gap: 14px; }\n  .pad { padding: 16px 16px 30px; }\n  .sheet { position: fixed; inset: 0; }\n  .sheetbox { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; border-radius: 26px 26px 0 0; animation: riseUp .3s cubic-bezier(.2,.85,.3,1); }\n  @media (min-width: 1000px) {\n    .shell { flex-direction: row; align-items: stretch; }\n    .side { display: flex; }\n    .tabbar { display: none; }\n    .cols2 { grid-template-columns: 1fr 1fr; gap: 18px; }\n    .pad { padding: 32px 40px 48px; max-width: 1920px; margin: 0 auto; }\n    .sheetbox { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%,-50%); width: 470px; max-height: 86%; border-radius: 26px; animation: none; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"shell\" style=\"background:#f6f7ff\">\n\n  <div class=\"side\" style=\"width:224px;flex-shrink:0;flex-direction:column;background:#ffffff;position:sticky;top:0;height:100vh;box-shadow:1px 0 0 rgba(33,36,61,.06)\">\n    <div style=\"padding:22px 20px 18px;display:flex;align-items:center;gap:11px\">\n      <div style=\"width:30px;height:30px;background:#5a5cd6;border-radius:10px;display:grid;place-items:center;color:#ffffff;font-weight:700;font-size:14px\">M<\u002Fdiv>\n      <span style=\"font-weight:700;font-size:17px;letter-spacing:-.01em\">Mensi<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:6px 12px;display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ sideNav }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ t.go }}\" style=\"padding:11px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:11px;background:{{ t.bg }}\" style-hover=\"background:#eef1ff\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"{{ t.color }}\" stroke-width=\"{{ t.stroke }}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"{{ t.icon }}\"><\u002Fpath>\n            <path d=\"{{ t.icon2 }}\"><\u002Fpath>\n          <\u002Fsvg>\n          <span style=\"font-size:13.5px;font-weight:{{ t.weight }};color:{{ t.color }}\">{{ t.label }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n\n    <div style=\"background:#ffffff;padding:14px 16px;display:flex;align-items:center;gap:11px;flex-shrink:0;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(33,36,61,.06)\">\n      <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ goBack }}\" style=\"cursor:pointer;width:30px;height:30px;border-radius:10px;background:#eef1ff;display:grid;place-items:center;font-size:14px;font-weight:700;color:#5a5cd6\" style-hover=\"background:#e0eae8\">←<\u002Fdiv>\n      <\u002Fsc-if>\n      <span style=\"font-weight:700;font-size:16px;letter-spacing:-.01em\">{{ headerTitle }}<\u002Fspan>\n      <span style=\"margin-left:auto;font-size:12px;font-weight:600;color:#545a7a\">{{ headerRight }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"pad\" style=\"flex:1;display:flex;flex-direction:column;gap:14px;width:100%\">\n\n      <sc-if value=\"{{ isMa }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;font-family:'Montserrat',sans-serif;color:#21243d\">\n\n  <sc-if value=\"{{ maPanel.isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"background:#eef1ff;border-radius:20px;padding:22px 18px\">\n        <div style=\"font-size:12.5px;font-weight:600;color:#5a5cd6\">Nincs még adat<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:700;margin-top:8px;letter-spacing:-.02em;line-height:1.25\">Előrejelzéshez legalább egy teljes ciklus kell.<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#2b2e63;line-height:1.6;margin-top:9px;text-wrap:pretty\">Amíg nincs elég mérés, az app nem mutat becsült ovulációt és menstruációt — inkább semmit, mint pontatlant.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ maPanel.emptySteps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:13px;background:#ffffff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 20px rgba(33,36,61,.04)\">\n            <div style=\"width:26px;height:26px;border-radius:99px;background:#eef1ff;display:grid;place-items:center;font-size:12px;font-weight:700;color:#5a5cd6;flex-shrink:0\">{{ s.n }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#464b6b;line-height:1.5;text-wrap:pretty\">{{ s.txt }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ maPanel.open }}\" style=\"width:100%;background:#5a5cd6;border:0;border-radius:99px;color:#ffffff;font:700 14px 'Montserrat';padding:18px 0;cursor:pointer\" style-hover=\"background:#4a4cbd\">Első bejegyzés rögzítése<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ maPanel.hasData }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n\n      <div style=\"border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 22px rgba(33,36,61,.07)\">\n        <div style=\"background:#5a5cd6;padding:20px 18px 18px\">\n          <div style=\"display:flex;align-items:center\">\n            <span style=\"font-size:12px;font-weight:600;color:#d2daff\">Ciklus 14. nap<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:11.5px;font-weight:500;color:#b1b2ff\">aug. 10. óta<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:25px;font-weight:700;color:#ffffff;letter-spacing:-.025em;line-height:1.18;margin-top:10px\">Termékeny ablakban vagy — az ovuláció 4 napon belül várható<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-top:16px\">\n            <div style=\"flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:11px 13px\">\n              <div style=\"font-size:10.5px;font-weight:600;color:#d2daff\">Ovuláció<\u002Fdiv>\n              <div style=\"font-size:15px;font-weight:700;color:#ffffff;margin-top:3px\">aug. 23–27.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:11px 13px\">\n              <div style=\"font-size:10.5px;font-weight:600;color:#d2daff\">Következő menstruáció<\u002Fdiv>\n              <div style=\"font-size:15px;font-weight:700;color:#ffffff;margin-top:3px\">szept. 4–8.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px\">\n            <div style=\"display:flex;align-items:baseline\">\n              <span style=\"font-size:11px;font-weight:600;color:#d2daff\">{{ maPanel.phaseLabel }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:11px;font-weight:700;color:#ffffff\">{{ maPanel.remainingLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:4px;margin-top:7px\">\n              <sc-for list=\"{{ maPanel.remainingDots }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div style=\"flex:1;height:7px;border-radius:99px;background:{{ d.bg }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;padding:18px\">\n          <div style=\"display:flex;align-items:center\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#545a7a\">{{ maPanel.weekRange }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:11px;font-weight:600;color:#4a4cbd;background:#eef1ff;border-radius:99px;padding:5px 10px\">konfidencia: közepes<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px auto 0;max-width:400px\">\n            <sc-for list=\"{{ maPanel.weekHeads }}\" as=\"w\" hint-placeholder-count=\"7\">\n              <div style=\"text-align:center;font-size:10px;font-weight:600;color:#626884;padding-bottom:2px\">{{ w }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ maPanel.cycleDays }}\" as=\"d\" hint-placeholder-count=\"35\">\n              <div style=\"aspect-ratio:1;border-radius:10px;background:{{ d.bg }};box-shadow:{{ d.ring }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px\">\n                <span style=\"font-size:8px;font-weight:600;color:{{ d.tagFg }};line-height:1\">{{ d.tag }}<\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:{{ d.weight }};color:{{ d.fg }};line-height:1.1\">{{ d.n }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px 13px;margin-top:15px\">\n            <sc-for list=\"{{ maPanel.cycleLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:9px;height:9px;border-radius:3px;background:{{ l.bg }}\"><\u002Fdiv><span style=\"font-size:11px;font-weight:500;color:#464b6b\">{{ l.label }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ maPanel.openEsely }}\" style=\"background:#ffffff;border-radius:18px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 20px rgba(33,36,61,.04)\" style-hover=\"box-shadow:0 1px 2px rgba(33,36,61,.08),0 8px 26px rgba(33,36,61,.1)\">\n        <div style=\"display:flex;align-items:baseline\">\n          <span style=\"font-size:12.5px;font-weight:600;color:#545a7a\">Időzítés ebben a ciklusban<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:11px;font-weight:700;color:#4a4cbd;background:#eef1ff;border-radius:99px;padding:4px 10px\">Közepes<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:5px;margin-top:14px\">\n          <sc-for list=\"{{ maPanel.timingDays }}\" as=\"d\" hint-placeholder-count=\"10\">\n            <div style=\"flex:1;height:26px;border-radius:8px;background:{{ d.bg }};box-shadow:{{ d.ring }};display:flex;align-items:center;justify-content:center\">\n              <sc-if value=\"{{ d.hasCount }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:9px;font-weight:700;color:#ffffff\">{{ d.count }}×<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:5px;margin-top:5px\">\n          <sc-for list=\"{{ maPanel.timingDays }}\" as=\"d\" hint-placeholder-count=\"10\">\n            <div style=\"flex:1;text-align:center;font-size:8.5px;font-weight:{{ d.dateWeight }};color:{{ d.dateColor }}\">{{ d.short }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px;margin-top:9px\">\n          <div style=\"width:8px;height:8px;border-radius:2px;box-shadow:inset 0 0 0 2px #5a5cd6\"><\u002Fdiv>\n          <span style=\"font-size:10.5px;font-weight:500;color:#8f96b5\">Ovulációs ablak — itt számít legtöbbet az együttlét<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;margin-top:9px\">\n          <span style=\"font-size:12px;color:#464b6b\">3 együttlét · 4 nap hátra<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:12px;font-weight:700;color:#5a5cd6\">Részletek<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border-radius:18px;padding:17px 18px;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 20px rgba(33,36,61,.04)\">\n        <div style=\"font-size:12.5px;font-weight:600;color:#545a7a\">Tegnap · aug. 22.<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:11px\">\n          <sc-for list=\"{{ maPanel.yesterday }}\" as=\"y\" hint-placeholder-count=\"5\">\n            <span style=\"font-size:12px;font-weight:600;color:{{ y.color }};background:{{ y.bg }};border-radius:99px;padding:6px 12px\">{{ y.text }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border-radius:18px;padding:17px 18px;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 20px rgba(33,36,61,.04)\">\n        <div style=\"display:flex;align-items:center\">\n          <span style=\"font-size:13px;font-weight:700\">Mai bejegyzés<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:11.5px;font-weight:600;color:#545a7a\">{{ maPanel.loggedCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#545a7a;margin-top:5px;line-height:1.45\">Külön-külön is rögzíthető — csak azt töltsd ki, ami ma történt.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px;margin-top:13px\">\n          <sc-for list=\"{{ maPanel.fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ f.go }}\" style=\"display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;background:{{ f.bg }};cursor:pointer\" style-hover=\"background:#eef1ff\">\n              <span style=\"font-size:12.5px;font-weight:600;color:#464b6b;width:84px;flex-shrink:0\">{{ f.label }}<\u002Fspan>\n              <span style=\"font-size:13.5px;font-weight:{{ f.weight }};color:{{ f.fg }}\">{{ f.value }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:11.5px;font-weight:700;color:#5a5cd6;white-space:nowrap\">{{ f.action }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ maPanel.openAll }}\" style=\"width:100%;margin-top:13px;background:#eef1ff;border:0;border-radius:99px;color:#3a3c9e;font:700 13px 'Montserrat';padding:15px 0;cursor:pointer\" style-hover=\"background:#dfe4ff\">Mind végigkérdezése<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTrendek }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#ffffff;border-radius:20px;padding:20px 18px;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 20px rgba(33,36,61,.04)\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#545a7a\">Ciklushossz · utolsó 6 ciklus<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:9px;margin-top:7px\">\n              <span style=\"font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1\">28<\u002Fspan>\n              <span style=\"font-size:14px;font-weight:600;color:#464b6b\">nap az átlag<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#464b6b;line-height:1.55;margin-top:8px;text-wrap:pretty\">A ciklusaid <span style=\"font-weight:700;color:#21243d\">26 és 31 nap<\u002Fspan> között mozogtak, ±1,6 nap szórással.<\u002Fdiv>\n\n            <div style=\"position:relative;margin-top:28px;height:58px\">\n              <div style=\"position:absolute;left:0;right:0;top:22px;height:10px;border-radius:99px;background:#f0f2fb\"><\u002Fdiv>\n              <div style=\"position:absolute;left:{{ bandLeft }};width:{{ bandW }};top:22px;height:10px;border-radius:99px;background:#c6d6ff\"><\u002Fdiv>\n              <div style=\"position:absolute;left:{{ avgLeft }};top:14px;width:3px;height:26px;margin-left:-1.5px;border-radius:99px;background:#5a5cd6\"><\u002Fdiv>\n              <sc-for list=\"{{ lenMarks }}\" as=\"m\" hint-placeholder-count=\"6\">\n                <div style=\"position:absolute;left:{{ m.left }};top:19px;width:16px;height:16px;margin-left:-8px;border-radius:99px;background:{{ m.bg }};border:2px solid #ffffff;box-shadow:0 1px 3px rgba(33,36,61,.2)\"><\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ lenAxis }}\" as=\"a\" hint-placeholder-count=\"5\">\n                <div style=\"position:absolute;left:{{ a.left }};top:40px;transform:translateX(-50%);font-size:10px;font-weight:600;color:#626884\">{{ a.n }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"position:absolute;left:{{ avgLeft }};top:-4px;transform:translateX(-50%);font-size:10px;font-weight:700;color:#5a5cd6;white-space:nowrap\">átlag 28<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:8px;margin-top:22px;flex-wrap:wrap\">\n              <sc-for list=\"{{ lenStats }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"flex:1;min-width:78px;background:{{ t.bg }};border-radius:14px;padding:13px 12px;text-align:center\">\n                  <div style=\"font-size:18px;font-weight:700;letter-spacing:-.02em;color:{{ t.fg }}\">{{ t.value }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;font-weight:600;color:#545a7a;margin-top:2px\">{{ t.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;padding:22px 0 9px;border-top:1px solid #eef1ff;margin-top:20px\">\n              <span style=\"flex:1.4;font-size:10.5px;font-weight:600;color:#545a7a\">Kezdet<\u002Fspan>\n              <span style=\"width:58px;flex-shrink:0;font-size:10.5px;font-weight:600;color:#545a7a;text-align:right\">Hossz<\u002Fspan>\n              <span style=\"width:78px;flex-shrink:0;font-size:10.5px;font-weight:600;color:#545a7a;text-align:right\">Átlaghoz<\u002Fspan>\n              <span style=\"width:62px;flex-shrink:0;font-size:10.5px;font-weight:600;color:#545a7a;text-align:right\">Luteális<\u002Fspan>\n              <span style=\"width:72px;flex-shrink:0;font-size:10.5px;font-weight:600;color:#545a7a;text-align:right\">Időzítés<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ historyRows }}\" as=\"h\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;padding:11px 8px;margin:0 -8px;border-radius:10px;background:{{ h.rowBg }};border-top:1px solid #eef1ff\">\n                <span style=\"flex:1.4;font-size:13px;font-weight:600\">{{ h.label }}<\u002Fspan>\n                <span style=\"width:58px;flex-shrink:0;font-size:13.5px;font-weight:700;text-align:right\">{{ h.len }}<\u002Fspan>\n                <span style=\"width:78px;flex-shrink:0;text-align:right\"><span style=\"font-size:11px;font-weight:700;color:{{ h.devFg }};background:{{ h.devBg }};border-radius:99px;padding:4px 9px;white-space:nowrap\">{{ h.dev }}<\u002Fspan><\u002Fspan>\n                <span style=\"width:62px;flex-shrink:0;font-size:12.5px;font-weight:500;color:#464b6b;text-align:right\">{{ h.lut }}<\u002Fspan>\n                <span style=\"width:72px;flex-shrink:0;text-align:right\"><span style=\"font-size:11px;font-weight:700;color:{{ h.timingColor }};background:{{ h.timingBg }};border-radius:99px;padding:4px 9px\">{{ h.timing }}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#ffffff;border-radius:20px;padding:20px 18px 16px;box-shadow:0 1px 2px rgba(33,36,61,.05),0 6px 20px rgba(33,36,61,.04)\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <span style=\"font-size:13px;font-weight:700\">Bazális testhő<\u002Fspan>\n              < \n        const disabled = st.crampI === 0;\n        return {\n          label: l,\n          bg: disabled ? '#f5f7fe' : (st.crampT === l ? TINT : '#f5f7fe'),\n          ring: disabled ? 'none' : ring(st.crampT === l, TEAL),\n          fg: disabled ? '#c1c5db' : (st.crampT === l ? TEAL : T),\n          cursor: disabled ? 'not-allowed' : 'pointer',\n          opacity: disabled ? '.55' : '1',\n          pick: disabled ? (() => {}) : (() => this.setState({ crampT: l, crampI: st.crampI == null ? 1 : st.crampI, skipped: { ...st.skipped, 3: false } }))\n        };\n      }),\n      crampScale: CRAMP_L.map((l, i) => ({\n        label: l, h: (24 + i * 15) + 'px',\n        bg: st.crampI === i ? TEAL : 'rgba(90,92,214,' + (0.1 + i * 0.16) + ')',\n        ring: ring(st.crampI === i, '#3a3c9e'),\n        fg: st.crampI === i ? TEAL : T2,\n        pick: () => this.setState({ crampI: i, skipped: { ...st.skipped, 3: false } })\n      })),\n      flowScale: FLOW_L.map((l, i) => ({\n        label: l, h: (22 + i * 14) + 'px',\n        bg: st.flow === i ? PLUM : 'rgba(150,152,226,' + (0.12 + i * 0.17) + ')',\n        ring: ring(st.flow === i, '#3a3c9e'),\n        fg: st.flow === i ? PLUM_T : T2,\n        pick: () => this.setState({ flow: i, skipped: { ...st.skipped, 4: false } })\n      })),\n      togglePeriodStart: () => this.setState({ periodStart: !st.periodStart, skipped: { ...st.skipped, 4: false } }),\n      psBg: st.periodStart ? '#e6e7fb' : '#f5f7fe',\n      psRing: ring(st.periodStart, '#6f71d6'),\n      psFg: st.periodStart ? '#3a3c9e' : T,\n      psBoxBg: st.periodStart ? '#6f71d6' : '#ffffff',\n      psBoxRing: st.periodStart ? 'none' : 'inset 0 0 0 2px #d8dcec',\n      psMark: st.periodStart ? '✓' : '',\n      sexPlus: () => this.setState({ sexEvents: [...st.sexEvents, { protected: false }].slice(0, 6), sexSet: true, skipped: { ...st.skipped, 5: false } }),\n      sexMinus: () => this.setState({ sexEvents: st.sexEvents.slice(0, -1), sexSet: true, skipped: { ...st.skipped, 5: false } }),\n      sexCount: st.sexEvents.length,\n      hasSexEvents: st.sexEvents.length > 0,\n      sexEvents: st.sexEvents.map((ev, i) => ({\n        label: (i + 1) + '. alkalom',\n        trackBg: ev.protected ? TEAL : '#dde1ef',\n        knobLeft: ev.protected ? '21.5px' : '2.5px',\n        toggle: () => {\n          const next = st.sexEvents.slice();\n          next[i] = { protected: !next[i].protected };\n          this.setState({ sexEvents: next });\n        }\n      })),\n      sexLabel: st.sexEvents.length === 0 ? 'Ma nem volt' : (st.sexEvents.length === 1 ? 'Egy alkalom' : st.sexEvents.length + ' alkalom'),\n      sexNote: st.sexSet ? 'rögzítve' : 'állítsd be a mai számot',\n      sexBg: st.sexEvents.length > 0 ? TINT : '#f5f7fe',\n      sexRing: ring(st.sexEvents.length > 0, TEAL),\n      sexFg: st.sexEvents.length > 0 ? TEAL : T,\n      sexMinusFg: st.sexEvents.length > 0 ? '#3a3c9e' : '#a8adc7',\n      summaryRows\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
